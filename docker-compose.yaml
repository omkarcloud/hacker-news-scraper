services:
  hacker-news-scraper:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional: you do not need a proxy, every data source answers a normal connection.
      # Set one only if your IP gets blocked.
      # - HACKER_NEWS_PROXY=http://user:pass@host:port
